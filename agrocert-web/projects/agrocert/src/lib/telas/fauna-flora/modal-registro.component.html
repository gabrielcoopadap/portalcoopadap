<ac-modal [aberto]="aberto" titulo="Novo registro de ocorrência" (fechar)="aberto = false">
  <form ngNativeValidate (ngSubmit)="salvar()" #f="ngForm">
    <div class="cm-modal__corpo">
      <div class="cm-linha">
        <div class="cm-campo">
          <label for="rg-especie">Espécie *</label>
          <select id="rg-especie" class="cm-select" name="EspecieId" required [(ngModel)]="form.especieId">
            <option value="">Selecione</option>
            <optgroup *ngFor="let g of gruposEspecies" [label]="g.rotulo">
              <option *ngFor="let e of g.especies" [value]="'' + e.id">{{ e.nomePopular }}{{ e.nomeCientifico ? ' (' + e.nomeCientifico + ')' : '' }}</option>
            </optgroup>
          </select>
          <a class="cm-ajuda" [routerLink]="'fauna-flora/especies' | acRota" (click)="aberto = false">Não encontrou? Cadastre a espécie no catálogo</a>
        </div>
        <div class="cm-campo">
          <label for="rg-data">Data e hora *</label>
          <input id="rg-data" type="datetime-local" class="cm-input" name="DataHora" required [(ngModel)]="form.dataHora" [max]="maxDataHora" />
        </div>
      </div>

      <span class="cm-rotulo">Como foi registrada</span>
      <div class="cm-opcoes" style="margin-top:6px">
        <ng-container *ngFor="let o of origens">
          <input type="radio" [id]="'orig-' + o" name="Origem" [value]="o" [(ngModel)]="form.origem" />
          <label [for]="'orig-' + o">{{ rotuloOrigem(o) }}</label>
        </ng-container>
      </div>
      <div class="cm-campo" [hidden]="form.origem !== 'CAMERA'">
        <label for="rg-camera">Câmera</label>
        <input id="rg-camera" class="cm-input" name="Camera" placeholder="Ex: Câmera 05 — Reserva Legal" [(ngModel)]="form.camera" />
      </div>

      <div class="cm-linha">
        <div class="cm-campo">
          <label for="rg-area">Área</label>
          <select id="rg-area" class="cm-select" name="Area" [(ngModel)]="form.area">
            <option *ngFor="let a of areas" [value]="a">{{ a }}</option>
          </select>
        </div>
        <div class="cm-campo">
          <label for="rg-prop">Propriedade</label>
          <select id="rg-prop" class="cm-select" name="PropriedadeId" [(ngModel)]="form.propriedadeId">
            <option value="">—</option>
            <option *ngFor="let p of propriedades" [value]="'' + p.id">{{ p.nome }}</option>
          </select>
        </div>
      </div>
      <div class="cm-linha cm-linha--3">
        <div class="cm-campo"><label for="rg-lat">Latitude</label><input id="rg-lat" class="cm-input" name="Latitude" inputmode="decimal" placeholder="-19.205000" [(ngModel)]="form.latitude" /></div>
        <div class="cm-campo"><label for="rg-lon">Longitude</label><input id="rg-lon" class="cm-input" name="Longitude" inputmode="decimal" placeholder="-46.245000" [(ngModel)]="form.longitude" /></div>
        <div class="cm-campo"><label for="rg-qtd">Quantidade de indivíduos</label><input id="rg-qtd" type="number" min="1" class="cm-input" name="Quantidade" [(ngModel)]="form.quantidade" /></div>
      </div>
      <button type="button" class="cm-btn cm-btn--texto cm-btn--pequeno" style="margin:-4px 0 10px" [class.is-carregando]="localizando" (click)="minhaLocalizacao()">
        <span class="material-icons" aria-hidden="true">my_location</span> Usar minha localização
      </button>
      <p class="cm-ajuda" style="margin-top:-6px">Dica: no painel, clique no ponto do mapa para preencher a localização.</p>

      <div class="cm-campo"><label for="rg-foto">Foto</label><input #foto id="rg-foto" type="file" accept="image/*" class="cm-input" name="Foto" (change)="arquivo = foto.files?.[0] ?? null" /></div>
      <div class="cm-campo"><label for="rg-obs">Observações</label><textarea id="rg-obs" class="cm-textarea" name="Observacao" placeholder="Comportamento, vestígios, estado da vegetação..." [(ngModel)]="form.observacao"></textarea></div>
    </div>
    <div class="cm-modal__acoes">
      <button type="button" class="cm-btn cm-btn--contorno" (click)="aberto = false">Cancelar</button>
      <button type="submit" class="cm-btn cm-btn--primario" [class.is-carregando]="salvando" [disabled]="salvando">{{ salvando ? 'Salvando...' : 'Registrar' }}</button>
    </div>
  </form>
</ac-modal>
